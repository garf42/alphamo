[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamo"
version = "0.0.1"
description = "LLM-driven evolutionary search for value-capture architectures (FunSearch lineage)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "click>=8",
    "anthropic>=0.92",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
alphamo = "alphamo.main:cli"

[tool.setuptools.packages.find]
include = ["alphamo*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the Anthropic API; skipped unless ANTHROPIC_API_KEY is set and RUN_LIVE_TESTS=1",
]
